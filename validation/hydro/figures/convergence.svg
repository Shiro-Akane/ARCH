<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Smooth advection density L1 convergence</title>
  <desc id="desc">PCM converges at first order, MUSCL at second order, and PPM near fourth order for this smooth contact test.</desc>
  <rect width="720" height="420" fill="#ffffff"/>
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="18">Smooth advection: density L1 error</text>
  <g stroke="#d8dee9" stroke-width="1">
    <line x1="90" y1="60" x2="620" y2="60"/><line x1="90" y1="130" x2="620" y2="130"/>
    <line x1="90" y1="200" x2="620" y2="200"/><line x1="90" y1="270" x2="620" y2="270"/>
    <line x1="90" y1="340" x2="620" y2="340"/>
  </g>
  <g stroke="#2e3440" stroke-width="1.5"><line x1="90" y1="50" x2="90" y2="340"/><line x1="90" y1="340" x2="620" y2="340"/></g>
  <g fill="#4c566a" font-family="sans-serif" font-size="12">
    <text x="80" y="64" text-anchor="end">1e-2</text><text x="80" y="134" text-anchor="end">1e-4</text>
    <text x="80" y="204" text-anchor="end">1e-6</text><text x="80" y="274" text-anchor="end">1e-8</text>
    <text x="80" y="344" text-anchor="end">1e-10</text>
    <text x="140" y="360" text-anchor="middle">64</text><text x="350" y="360" text-anchor="middle">128</text><text x="560" y="360" text-anchor="middle">256</text>
    <text x="355" y="390" text-anchor="middle">cells</text>
    <text x="24" y="200" text-anchor="middle" transform="rotate(-90 24 200)">L1 error</text>
  </g>
  <polyline points="140,74 350,85 560,95" fill="none" stroke="#5e81ac" stroke-width="3"/>
  <polyline points="140,123 350,145 560,166" fill="none" stroke="#a3be8c" stroke-width="3"/>
  <polyline points="140,221 350,263 560,305" fill="none" stroke="#bf616a" stroke-width="3"/>
  <g fill="#5e81ac"><circle cx="140" cy="74" r="5"/><circle cx="350" cy="85" r="5"/><circle cx="560" cy="95" r="5"/></g>
  <g fill="#a3be8c"><circle cx="140" cy="123" r="5"/><circle cx="350" cy="145" r="5"/><circle cx="560" cy="166" r="5"/></g>
  <g fill="#bf616a"><circle cx="140" cy="221" r="5"/><circle cx="350" cy="263" r="5"/><circle cx="560" cy="305" r="5"/></g>
  <g font-family="sans-serif" font-size="13">
    <rect x="635" y="95" width="14" height="4" fill="#5e81ac"/><text x="655" y="101">PCM</text>
    <rect x="635" y="120" width="14" height="4" fill="#a3be8c"/><text x="655" y="126">MUSCL</text>
    <rect x="635" y="145" width="14" height="4" fill="#bf616a"/><text x="655" y="151">PPM</text>
  </g>
</svg>
