<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Burn solver errors relative to BE NR</title>
  <desc id="desc">BD and ROS4 both lie below the acceptance threshold for species and total energy.</desc>
  <rect width="720" height="420" fill="#ffffff"/>
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="18">aprox13 one-zone error relative to BE_NR</text>
  <g stroke="#d8dee9" stroke-width="1">
    <line x1="90" y1="60" x2="640" y2="60"/><line x1="90" y1="130" x2="640" y2="130"/><line x1="90" y1="200" x2="640" y2="200"/><line x1="90" y1="270" x2="640" y2="270"/><line x1="90" y1="340" x2="640" y2="340"/>
  </g>
  <line x1="90" y1="200" x2="640" y2="200" stroke="#bf616a" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="635" y="192" text-anchor="end" font-family="sans-serif" font-size="12" fill="#bf616a">1e-8 tolerance</text>
  <g stroke="#2e3440" stroke-width="1.5"><line x1="90" y1="50" x2="90" y2="340"/><line x1="90" y1="340" x2="640" y2="340"/></g>
  <g fill="#4c566a" font-family="sans-serif" font-size="12">
    <text x="80" y="64" text-anchor="end">1e-4</text><text x="80" y="134" text-anchor="end">1e-6</text><text x="80" y="204" text-anchor="end">1e-8</text><text x="80" y="274" text-anchor="end">1e-10</text><text x="80" y="344" text-anchor="end">1e-12</text>
    <text x="230" y="365" text-anchor="middle">BD</text><text x="500" y="365" text-anchor="middle">ROS4</text>
    <text x="24" y="200" text-anchor="middle" transform="rotate(-90 24 200)">absolute or relative error</text>
  </g>
  <rect x="170" y="287" width="55" height="53" fill="#5e81ac"/><rect x="235" y="298" width="55" height="42" fill="#a3be8c"/>
  <rect x="440" y="287" width="55" height="53" fill="#5e81ac"/><rect x="505" y="298" width="55" height="42" fill="#a3be8c"/>
  <g font-family="sans-serif" font-size="13"><rect x="475" y="385" width="14" height="10" fill="#5e81ac"/><text x="495" y="395">species Linf</text><rect x="590" y="385" width="14" height="10" fill="#a3be8c"/><text x="610" y="395">energy</text></g>
</svg>
