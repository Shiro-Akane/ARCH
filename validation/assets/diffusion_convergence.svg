<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">RKL2 diffusion tracer L1 convergence</title>
  <desc id="desc">Tracer error decreases by a factor of four for each doubling from 64 to 256 cells.</desc>
  <rect width="720" height="420" fill="#ffffff"/>
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="18">RKL2 species diffusion: tracer L1 error</text>
  <g stroke="#d8dee9" stroke-width="1"><line x1="90" y1="60" x2="620" y2="60"/><line x1="90" y1="200" x2="620" y2="200"/><line x1="90" y1="340" x2="620" y2="340"/></g>
  <g stroke="#2e3440" stroke-width="1.5"><line x1="90" y1="50" x2="90" y2="340"/><line x1="90" y1="340" x2="620" y2="340"/></g>
  <g fill="#4c566a" font-family="sans-serif" font-size="12">
    <text x="80" y="64" text-anchor="end">1e-5</text><text x="80" y="204" text-anchor="end">1e-6</text><text x="80" y="344" text-anchor="end">1e-7</text>
    <text x="140" y="360" text-anchor="middle">64</text><text x="350" y="360" text-anchor="middle">128</text><text x="560" y="360" text-anchor="middle">256</text>
    <text x="355" y="390" text-anchor="middle">cells</text><text x="24" y="200" text-anchor="middle" transform="rotate(-90 24 200)">L1 error</text>
  </g>
  <polyline points="140,104 350,188 560,273" fill="none" stroke="#5e81ac" stroke-width="3"/>
  <g fill="#5e81ac"><circle cx="140" cy="104" r="6"/><circle cx="350" cy="188" r="6"/><circle cx="560" cy="273" r="6"/></g>
  <text x="465" y="155" font-family="sans-serif" font-size="13" fill="#2e3440">observed rate = 2.00</text>
</svg>
