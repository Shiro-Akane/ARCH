<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'"><link rel="stylesheet" href="launcher.css"><title>ARCH Studio — Open project</title></head><body><main><h1>ARCH Studio</h1><p>Local desktop · native scientific Host</p><label>Project<input id="project" placeholder="Choose an ARCH project"></label><button id="pick">Choose project…</button><label id="distro-field">WSL distribution (for Linux projects)<input id="distro" placeholder="Native Windows by default; set for WSL"></label><label>Configuration (optional)<input id="config" placeholder="Project-relative .par"></label><label>Existing build directory (optional)<input id="build-dir" placeholder="Project-relative configured Ninja tree"></label><label>Binary (optional)<input id="binary" placeholder="build-studio-cpu/bin/ARCH[.exe]"></label><label>Registered model (optional)<input id="case" placeholder="Sod"></label><label>Source (optional)<input id="source" placeholder="Project-relative source path"></label><button id="launch">Open project</button><p id="status" role="status"></p><p>Requires native Node 24+ and a supported Host Build Profile. Configure and Build are explicit actions. A missing executable keeps Core operations unavailable.</p></main><script src="launcher.js"></script></body></html>
