name: ARCH CI

on:
  pull_request:
    branches: [main]

# Public PRs run only on disposable GitHub-hosted machines, without secrets or
# write permissions. Do not change this to pull_request_target to run PR code.
permissions:
  contents: read

concurrency:
  group: arch-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  tooling:
    name: Tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare host tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential cmake ninja-build mold python3 python3-numpy python3-h5py shellcheck
          mkdir -p build-ci/tooling
          git rev-parse HEAD > build-ci/tooling/commit.txt

      - name: Validate workflow syntax
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' \
            8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 \
            "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color \
            2>&1 | tee build-ci/tooling/workflow.log

      - name: Audit shared implementation and header boundaries
        run: |
          python3 tools/audit_architecture.py . \
            2>&1 | tee build-ci/tooling/architecture.log

      - name: Run the existing Python suite without skips
        run: |
          python3 - <<'PY' 2>&1 | tee build-ci/tooling/unittest.log
          import sys
          import unittest

          suite = unittest.defaultTestLoader.discover("tests/tooling", pattern="test_*.py")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.testsRun or result.skipped:
              print("CI requires a nonempty tooling suite with no skipped controls.")
          sys.exit(0 if result.wasSuccessful() and result.testsRun and not result.skipped else 1)
          PY

      - name: Retain tooling diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tooling-${{ github.run_id }}-${{ github.run_attempt }}
          path: build-ci/tooling/
          retention-days: 14
          if-no-files-found: warn

  cpu:
    name: CPU Release
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CC: gcc-12
      CXX: g++-12
      OMP_NUM_THREADS: '2'
      OMP_DYNAMIC: 'FALSE'
      CCACHE_DIR: ${{ github.workspace }}/build-ci/ccache
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPILERCHECK: content
    steps:
      - name: Check out source and the required EOS table
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          # Limit LFS hydration while checkout still owns its temporary auth.
          # Do not fetch historical HDF5 results or unused large EOS tables.
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: lfs.fetchinclude
          GIT_CONFIG_VALUE_0: EOS_toolkit/tables/helmholtz/helm_table.dat
          GIT_CONFIG_KEY_1: lfs.fetchexclude
          GIT_CONFIG_VALUE_1: ''
        with:
          persist-credentials: false
          lfs: true

      - name: Prepare the CPU toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            gcc-12 g++-12 cmake ninja-build ccache mold libhdf5-dev python3 python3-numpy python3-h5py
          mkdir -p build-ci/reports
          git rev-parse HEAD > build-ci/reports/commit.txt
          python3 --version
          cmake --version
          gcc-12 --version
          free -h

      - name: Identify native compiler targets for the cache
        id: compiler
        run: |
          # Release uses -march=native. Never share its cached objects across
          # machines with different resolved target flags or compiler binaries.
          identity=$(gcc-12 -march=native -Q --help=target | sha256sum | cut -d ' ' -f 1)
          echo "target=$identity" >> "$GITHUB_OUTPUT"

      - name: Restore compiler cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build-ci/ccache
          key: arch-cpu-ubuntu24-gcc12-${{ steps.compiler.outputs.target }}-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-${{ github.sha }}
          restore-keys: |
            arch-cpu-ubuntu24-gcc12-${{ steps.compiler.outputs.target }}-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-

      - name: Configure the existing CPU Release preset with tests and KLU
        run: |
          cmake --preset cpu-release -B build-ci/cpu \
            -DBUILD_TESTING=ON -DARCH_ENABLE_KLU=ON -DARCH_FETCH_SUITESPARSE=ON \
            -DARCH_RUNTIME_OUTPUT_DIRECTORY="$PWD/build-ci/cpu/bin" \
            2>&1 | tee build-ci/reports/configure.log
          ctest --test-dir build-ci/cpu -LE '^tooling$' --show-only=json-v1 > build-ci/reports/inventory.json
          python3 tools/check_ci_results.py --inventory build-ci/reports/inventory.json

      - name: Build the application and existing CPU validation suite
        run: |
          python3 tools/run_memory_guarded.py \
            --min-available-mib 1536 --max-swap-growth-mib 512 --pressure-guard \
            --log build-ci/reports/build.log -- \
            cmake --build build-ci/cpu --parallel 2

      - name: Run every configured CPU numerical and API test
        run: |
          ctest --test-dir build-ci/cpu -LE '^tooling$' --parallel 1 --timeout 600 \
            --no-tests=error --output-on-failure \
            --output-junit "$PWD/build-ci/reports/ctest.xml" \
            2>&1 | tee build-ci/reports/ctest.log
          python3 tools/check_ci_results.py \
            --inventory build-ci/reports/inventory.json --junit build-ci/reports/ctest.xml

      - name: Validate low-density physical trajectories and repair accounting
        run: |
          /usr/bin/python3 validation/low_density/run.py \
            --arch "$PWD/build-ci/cpu/bin/ARCH" --backend cpu \
            --output-root "$PWD/build-ci/low-density" \
            2>&1 | tee build-ci/reports/low-density.log
          test -f build-ci/low-density/PASS

      - name: Report cache use
        if: always()
        run: |
          if command -v ccache >/dev/null; then ccache --show-stats; fi

      # Save only the current PR cache namespace after all CPU gates pass.
      - name: Save the successful PR compiler cache
        if: success() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build-ci/ccache
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Retain CPU diagnostics, not build products or checkpoints
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cpu-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build-ci/reports/
            build-ci/low-density/results.json
            build-ci/low-density/PASS
            build-ci/low-density/**/*.par
            build-ci/low-density/**/*.log
            build-ci/cpu/self-gravity-jeans/summary.json
            build-ci/cpu/self-gravity-jeans/**/*.par
            build-ci/cpu/self-gravity-jeans/**/*.log
            build-ci/cpu/Testing/Temporary/LastTest.log
            build-ci/cpu/Testing/Temporary/LastTestsFailed.log
          retention-days: 14
          if-no-files-found: warn

  studio:
    name: Studio and Host
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # This suite checks Node/React/Host, not native Electron window behavior.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare the declared Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.21.0'
          package-manager-cache: false

      - name: Record identity and install locked dependencies
        working-directory: studio
        run: |
          set -euo pipefail
          mkdir -p ../build-ci/studio
          git rev-parse HEAD > ../build-ci/studio/commit.txt
          node --version > ../build-ci/studio/node.txt
          npm --version > ../build-ci/studio/npm.txt
          /usr/bin/time -p npm ci 2>&1 | tee ../build-ci/studio/install.log

      - name: Run the full Studio suite including Host exactly once
        working-directory: studio
        run: |
          set -euo pipefail
          /usr/bin/time -p node --test --test-reporter=tap tests/*.test.ts \
            2> ../build-ci/studio/test-time.log | tee ../build-ci/studio/tests.tap
          python3 ../tools/check_ci_results.py --node-tap ../build-ci/studio/tests.tap

      - name: Lint and build production assets with type checking
        working-directory: studio
        run: |
          set -euo pipefail
          /usr/bin/time -p npm run lint 2>&1 | tee ../build-ci/studio/lint.log
          # npm run build already runs tsc --noEmit before Vite.
          /usr/bin/time -p npm run build 2>&1 | tee ../build-ci/studio/build.log

      # No new artifact upload: raw diagnostics remain in the disposable runner.

  required:
    name: CI required
    needs: [tooling, cpu, studio]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    env:
      TOOLING_RESULT: ${{ needs.tooling.result }}
      CPU_RESULT: ${{ needs.cpu.result }}
      STUDIO_RESULT: ${{ needs.studio.result }}
    steps:
      - name: Require all jobs to succeed
        run: |
          printf 'Tooling: %s\nCPU Release: %s\n' "$TOOLING_RESULT" "$CPU_RESULT"
          test "$TOOLING_RESULT" = success
          test "$CPU_RESULT" = success
          printf 'Studio and Host: %s\n' "$STUDIO_RESULT"
          test "$STUDIO_RESULT" = success
